<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>بازطراحی داخلی کارخانه AKK | AKK Factory Interior Redesign</title>

  <style>

    @font-face { font-family: Vazirmatn; src: url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Regular.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }

    @font-face { font-family: Vazirmatn; src: url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Medium.woff2') format('woff2'); font-weight: 500; font-style: normal; font-display: swap; }

    @font-face { font-family: Vazirmatn; src: url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-SemiBold.woff2') format('woff2'); font-weight: 600; font-style: normal; font-display: swap; }

    @font-face { font-family: Vazirmatn; src: url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn-Bold.woff2') format('woff2'); font-weight: 700; font-style: normal; font-display: swap; }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Vazirmatn', Tahoma, sans-serif; }

    body { background: #07101e; color: #f8fafc; overflow-x: hidden; }

    #webgl-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 1; }

    #protractor-overlay { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 15; pointer-events: none; transition: opacity 0.35s ease; }

    .scroll-spacer { position: relative; z-index: 2; height: 850vh; pointer-events: none; }

    .sky-haze { position: fixed; top: 0; left: 0; width: 100vw; height: 18vh; background: linear-gradient(180deg, rgba(255,249,235,0.48) 0%, rgba(255,249,235,0) 100%); z-index: 10; pointer-events: none; transition: opacity 0.4s ease; }

    .progress-bar { position: fixed; top: 0; right: 0; height: 4px; width: 0%; background: linear-gradient(90deg, #00e1ff, #0055ff); z-index: 100; box-shadow: 0 0 12px #00e1ff; }

    .hud-nav { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 60; display: flex; gap: 8px; background: rgba(8,20,42,0.84); backdrop-filter: blur(12px); padding: 8px 14px; border-radius: 40px; border: 1px solid rgba(0,153,255,0.35); box-shadow: 0 10px 30px rgba(0,0,0,0.45); }

    .hud-btn { background: transparent; color: #a8c7fa; border: none; padding: 7px 14px; border-radius: 24px; cursor: pointer; font-size: 0.84rem; font-weight: 500; transition: all 0.25s ease; white-space: nowrap; }

    .hud-btn:hover { color: #fff; background: rgba(0,136,255,0.2); }

    .hud-btn.active { background: #0077ff; color: #fff; box-shadow: 0 0 14px rgba(0,119,255,0.7); }

    .hud-btn.protractor-toggle { border: 1px solid rgba(56,189,248,0.45); color: #38bdf8; }

    .hud-btn.protractor-toggle.on { background: rgba(14,165,233,0.25); color: #fff; }

    .info-card { position: fixed; bottom: 30px; right: 34px; width: 460px; max-width: calc(100vw - 34px); background: rgba(7,18,38,0.86); backdrop-filter: blur(14px); border: 1px solid rgba(0,162,255,0.35); border-right: 5px solid #0099ff; border-radius: 16px; padding: 20px 24px; z-index: 50; box-shadow: 0 15px 40px rgba(0,0,0,0.6); }

    .step-tag { display: inline-block; font-size: 0.75rem; color: #4dc3ff; background: rgba(0,140,255,0.2); padding: 3px 12px; border-radius: 20px; margin-bottom: 8px; border: 1px solid rgba(77,195,255,0.35); }

    .info-card h2 { font-size: 1.28rem; margin-bottom: 8px; color: #fff; }

    .info-card p { font-size: 0.86rem; line-height: 1.75; color: #cbd5e1; }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

    .chip { font-size: 0.7rem; color: #86efac; background: rgba(34,197,94,0.12); border: 1px solid rgba(74,222,128,0.35); padding: 2px 10px; border-radius: 14px; }

    .scroll-indicator { position: fixed; bottom: 30px; left: 34px; z-index: 50; display: flex; align-items: center; gap: 10px; background: rgba(7,18,38,0.82); padding: 10px 18px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.15); font-size: 0.84rem; color: #93c5fd; transition: opacity 0.3s ease; }

    .zone-legend { position: fixed; top: 74px; right: 34px; z-index: 55; display: flex; flex-direction: column; gap: 5px; background: rgba(7,18,38,0.78); backdrop-filter: blur(10px); padding: 10px 14px; border-radius: 12px; border: 1px solid rgba(0,162,255,0.28); font-size: 0.72rem; color: #cbd5e1; transition: opacity 0.35s ease; }

    .legend-row { display: flex; align-items: center; gap: 7px; }

    .legend-dot { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto; }

    @media (max-width: 768px) {

      .hud-nav { top: 10px; padding: 6px 8px; gap: 4px; flex-wrap: wrap; justify-content: center; width: 95vw; }

      .hud-btn { padding: 5px 9px; font-size: 0.72rem; }

      .info-card { right: 14px; left: 14px; bottom: 14px; width: auto; }

      .scroll-indicator { display: none; }

      .zone-legend { display: none; }

    }

  </style>

</head>

<body>

  <div class="progress-bar" id="progressBar"></div>

  <div class="sky-haze" id="skyHaze"></div>

  <svg id="protractor-overlay"></svg>

  <nav class="hud-nav">

    <button class="hud-btn active" data-target="0">۱. نمای هوایی</button>

    <button class="hud-btn" data-target="0.35">۲. تولید</button>

    <button class="hud-btn" data-target="0.68">۳. رنگ</button>

    <button class="hud-btn" data-target="0.98">۴. انبار</button>

    <button class="hud-btn protractor-toggle on" id="toggleProtractor">📐 نقاله زاویه‌ها</button>

  </nav>

  <div class="zone-legend" id="zoneLegend">

    <div class="legend-row"><span class="legend-dot" style="background:#3b82f6"></span> تولید (تزریق پلاستیک)</div>

    <div class="legend-row"><span class="legend-dot" style="background:#f97316"></span> فروشگاه رنگ (ایزوله)</div>

    <div class="legend-row"><span class="legend-dot" style="background:#14b8a6"></span> انبار پالتی</div>

    <div class="legend-row"><span class="legend-dot" style="background:#22c55e"></span> واک‌وی عابر پیاده</div>

  </div>

  <div class="info-card" id="infoCard">

    <span class="step-tag" id="stepTag">بخش اول • بازطراحی داخلی</span>

    <h2 id="stepTitle">کارخانه AKK — طرح بازطراحی داخلی</h2>

    <p id="stepDesc">در حال بارگذاری صحنه سه‌بعدی…</p>

    <div class="chips" id="stepChips"></div>

  </div>

  <div class="scroll-indicator" id="scrollHint">

    <span>اسکرول کنید تا وارد جریان تولید شوید ⬇</span>

  </div>

  <canvas id="webgl-canvas"></canvas>

  <div class="scroll-spacer"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

  <script>

    gsap.registerPlugin(ScrollTrigger);

    function boot() {

    // =========================================================

    // ۱. تنظیمات صحنه

    // =========================================================

    const canvas = document.getElementById('webgl-canvas');

    const scene = new THREE.Scene();

    scene.background = new THREE.Color(0xcbd5e1);

    scene.fog = new THREE.FogExp2(0xd2cbc0, 0.0022);

    const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.5, 950);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });

    renderer.setSize(window.innerWidth, window.innerHeight);

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    renderer.shadowMap.enabled = true;

    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    renderer.toneMapping = THREE.ACESFilmicToneMapping;

    renderer.toneMappingExposure = 1.12;

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.82);

    scene.add(ambientLight);

    const hemiLight = new THREE.HemisphereLight(0xdfeaff, 0x8b8f96, 0.55);

    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfff7e8, 1.2);

    sunLight.position.set(85, 130, 65);

    sunLight.castShadow = true;

    sunLight.shadow.mapSize.set(2048, 2048);

    const d = 220;

    sunLight.shadow.camera.left = -d;

    sunLight.shadow.camera.right = d;

    sunLight.shadow.camera.top = d;

    sunLight.shadow.camera.bottom = -d;

    sunLight.shadow.camera.near = 10;

    sunLight.shadow.camera.far = 480;

    scene.add(sunLight);

    // =========================================================

    // ۲. سیستم مختصات نقاله

    // =========================================================

    const PROTRACTOR_ORIGIN = new THREE.Vector3(8, 0, 62);

    const PERSPECTIVE_Z_SCALE = 1.55;

    function getProtractorDir(deg) {

      const rad = (deg * Math.PI) / 180;

      const dx = -Math.cos(rad);

      const dz = -Math.sin(rad) * PERSPECTIVE_Z_SCALE;

      const len = Math.hypot(dx, dz);

      return { ux: dx / len, uz: dz / len, rotY: Math.atan2(-dx, -dz) };

    }

    function getProtractorPoint(deg, dist, lateral = 0) {

      const dir = getProtractorDir(deg);

      const nx = -dir.uz;

      const nz = dir.ux;

      return new THREE.Vector3(

        PROTRACTOR_ORIGIN.x + dir.ux * dist + nx * lateral,

        0,

        PROTRACTOR_ORIGIN.z + dir.uz * dist + nz * lateral

      );

    }

    // =========================================================

    // ۳. تکسچرها

    // =========================================================

    function createCorrugatedTex(baseHex, stripeHex, rx = 24, ry = 18) {

      const c = document.createElement('canvas');

      c.width = c.height = 256;

      const ctx = c.getContext('2d');

      ctx.fillStyle = baseHex;

      ctx.fillRect(0, 0, 256, 256);

      for (let i = 0; i < 256; i += 7) {

        ctx.fillStyle = stripeHex;

        ctx.fillRect(i, 0, 2.8, 256);

        ctx.fillStyle = 'rgba(255,255,255,0.08)';

        ctx.fillRect(i + 2.8, 0, 1.2, 256);

      }

      ctx.fillStyle = 'rgba(0,0,0,0.12)';

      for (let y = 0; y < 256; y += 32) ctx.fillRect(0, y, 256, 1.5);

      const tex = new THREE.CanvasTexture(c);

      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;

      tex.repeat.set(rx, ry);

      return tex;

    }

    function createGridWinTex(cols = 5, rows = 3) {

      const c = document.createElement('canvas');

      c.width = 320; c.height = 192;

      const ctx = c.getContext('2d');

      ctx.fillStyle = '#0a1525';

      ctx.fillRect(0, 0, 320, 192);

      ctx.strokeStyle = '#60a5fa';

      ctx.lineWidth = 5;

      for (let i = 0; i <= cols; i++) {

        ctx.beginPath(); ctx.moveTo((i / cols) * 320, 0); ctx.lineTo((i / cols) * 320, 192); ctx.stroke();

      }

      for (let j = 0; j <= rows; j++) {

        ctx.beginPath(); ctx.moveTo(0, (j / rows) * 192); ctx.lineTo(320, (j / rows) * 192); ctx.stroke();

      }

      return new THREE.CanvasTexture(c);

    }

    function createRoadTex(repeats = 16) {

      const c = document.createElement('canvas');

      c.width = 128; c.height = 256;

      const ctx = c.getContext('2d');

      ctx.fillStyle = '#333840';

      ctx.fillRect(0, 0, 128, 256);

      ctx.fillStyle = '#cbd5e1';

      ctx.fillRect(61, 30, 6, 95);

      const tex = new THREE.CanvasTexture(c);

      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;

      tex.repeat.set(1, repeats);

      return tex;

    }

    function createFieldTex() {

      const c = document.createElement('canvas');

      c.width = c.height = 256;

      const ctx = c.getContext('2d');

      ctx.fillStyle = '#183a0e';

      ctx.fillRect(0, 0, 256, 256);

      for (let y = 0; y < 256; y += 8) {

        ctx.fillStyle = y % 16 === 0 ? '#244f15' : '#122e09';

        ctx.fillRect(0, y, 256, 4);

      }

      const tex = new THREE.CanvasTexture(c);

      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;

      tex.repeat.set(18, 18);

      return tex;

    }

    // --- تکسچرهای جدید بازطراحی ---

    function createEpoxyTex() {

      const c = document.createElement('canvas');

      c.width = c.height = 256;

      const ctx = c.getContext('2d');

      ctx.fillStyle = '#b7bec7';

      ctx.fillRect(0, 0, 256, 256);

      for (let i = 0; i < 900; i++) {

        ctx.fillStyle = 'rgba(255,255,255,' + (Math.random() * 0.05) + ')';

        ctx.fillRect(Math.random() * 256, Math.random() * 256, 2, 2);

        ctx.fillStyle = 'rgba(60,70,80,' + (Math.random() * 0.05) + ')';

        ctx.fillRect(Math.random() * 256, Math.random() * 256, 2, 2);

      }

      ctx.strokeStyle = 'rgba(70,80,92,0.4)';

      ctx.lineWidth = 2;

      ctx.strokeRect(0, 0, 256, 256);

      const tex = new THREE.CanvasTexture(c);

      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;

      tex.repeat.set(6, 48);

      return tex;

    }

    function createGratingTex() {

      const c = document.createElement('canvas');

      c.width = c.height = 128;

      const ctx = c.getContext('2d');

      ctx.fillStyle = '#8e979f';

      ctx.fillRect(0, 0, 128, 128);

      for (let x = 0; x < 128; x += 10) {

        ctx.fillStyle = '#c8d0d8';

        ctx.fillRect(x, 0, 5, 128);

        ctx.fillStyle = '#5c646c';

        ctx.fillRect(x + 5, 0, 2, 128);

      }

      for (let y = 0; y < 128; y += 26) {

        ctx.fillStyle = '#aeb6be';

        ctx.fillRect(0, y, 128, 3);

      }

      const tex = new THREE.CanvasTexture(c);

      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;

      tex.repeat.set(16, 40);

      return tex;

    }

    function createFenceTex() {

      const c = document.createElement('canvas');

      c.width = c.height = 128;

      const ctx = c.getContext('2d');

      ctx.clearRect(0, 0, 128, 128);

      ctx.strokeStyle = 'rgba(250, 204, 21, 0.95)';

      ctx.lineWidth = 3;

      for (let i = 0; i <= 128; i += 16) {

        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 128); ctx.stroke();

        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(128, i); ctx.stroke();

      }

      const tex = new THREE.CanvasTexture(c);

      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;

      tex.repeat.set(3, 1);

      return tex;

    }

    function createHazardTex() {

      const c = document.createElement('canvas');

      c.width = c.height = 128;

      const ctx = c.getContext('2d');

      ctx.fillStyle = '#facc15';

      ctx.fillRect(0, 0, 128, 128);

      ctx.fillStyle = '#111827';

      for (let i = -128; i < 256; i += 32) {

        ctx.beginPath();

        ctx.moveTo(i, 0); ctx.lineTo(i + 16, 0); ctx.lineTo(i + 16 + 128, 128); ctx.lineTo(i + 128, 128);

        ctx.closePath(); ctx.fill();

      }

      const tex = new THREE.CanvasTexture(c);

      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;

      tex.repeat.set(4, 0.5);

      return tex;

    }

    function createSignTex(fa, en, color) {

      const c = document.createElement('canvas');

      c.width = 512; c.height = 128;

      const ctx = c.getContext('2d');

      ctx.fillStyle = '#0b1e3a';

      ctx.fillRect(0, 0, 512, 128);

      ctx.strokeStyle = color;

      ctx.lineWidth = 7;

      ctx.strokeRect(7, 7, 498, 114);

      ctx.textAlign = 'center';

      ctx.fillStyle = '#ffffff';

      ctx.font = 'bold 46px Vazirmatn, Tahoma, sans-serif';

      ctx.fillText(fa, 256, 58);

      ctx.font = 'bold 27px Arial, sans-serif';

      ctx.fillStyle = color;

      ctx.fillText(en, 256, 102);

      return new THREE.CanvasTexture(c);

    }

    function createFloorDecalTex(fa, en, color) {

      const c = document.createElement('canvas');

      c.width = 512; c.height = 192;

      const ctx = c.getContext('2d');

      ctx.clearRect(0, 0, 512, 192);

      ctx.strokeStyle = color;

      ctx.lineWidth = 5;

      ctx.strokeRect(10, 10, 492, 172);

      ctx.textAlign = 'center';

      ctx.fillStyle = color;

      ctx.font = 'bold 64px Vazirmatn, Tahoma, sans-serif';

      ctx.fillText(fa, 256, 88);

      ctx.font = 'bold 44px Arial, sans-serif';

      ctx.fillText(en, 256, 152);

      return new THREE.CanvasTexture(c);

    }

    function createSafetyBoardTex() {

      const c = document.createElement('canvas');

      c.width = 320; c.height = 200;

      const ctx = c.getContext('2d');

      ctx.fillStyle = '#14532d';

      ctx.fillRect(0, 0, 320, 200);

      ctx.strokeStyle = '#f8fafc';

      ctx.lineWidth = 4;

      ctx.strokeRect(6, 6, 308, 188);

      ctx.fillStyle = '#ffffff';

      ctx.textAlign = 'center';

      ctx.font = 'bold 26px Vazirmatn, Tahoma, sans-serif';

      ctx.fillText('تابلو ایمنی', 160, 40);

      ctx.font = 'bold 17px Arial, sans-serif';

      ctx.fillText('SAFETY BOARD', 160, 64);

      const rows = ['#f87171', '#fbbf24', '#4ade80', '#60a5fa'];

      for (let i = 0; i < 4; i++) {

        ctx.fillStyle = rows[i];

        ctx.fillRect(28, 82 + i * 26, 264, 14);

      }

      return new THREE.CanvasTexture(c);

    }

    // =========================================================

    // ۴. متریال‌ها

    // =========================================================

    const blueRoofMat = new THREE.MeshStandardMaterial({

      map: createCorrugatedTex('#0050e6', '#003bb3', 26, 18),

      roughness: 0.32, metalness: 0.22, side: THREE.DoubleSide

    });

    const facadeBlueMat = new THREE.MeshStandardMaterial({

      map: createCorrugatedTex('#0044cc', '#003099', 14, 7),

      roughness: 0.42, side: THREE.DoubleSide

    });

    const blueSteelMat = new THREE.MeshStandardMaterial({ color: 0x0055dd, roughness: 0.32, metalness: 0.48 });

    const concreteWallMat = new THREE.MeshStandardMaterial({ color: 0x8b939e, roughness: 0.82 });

    const lightDoorMat = new THREE.MeshStandardMaterial({ color: 0xcbd5e1, roughness: 0.55 });

    const darkOpeningMat = new THREE.MeshStandardMaterial({ color: 0x090d16, roughness: 0.92 });

    const curbMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.7 });

    const gridWinMat = new THREE.MeshBasicMaterial({ map: createGridWinTex(5, 3) });

    const bushMat = new THREE.MeshStandardMaterial({ color: 0x265c19, roughness: 0.85 });

    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a3525 });

    const palletMat = new THREE.MeshStandardMaterial({ color: 0x78553a, roughness: 0.9 });

    const steelColumnMat = new THREE.MeshStandardMaterial({ color: 0x1e3a5f, roughness: 0.35, metalness: 0.55 });

    // --- متریال‌های داخلی بازطراحی ---

    const epoxyFloorMat = new THREE.MeshStandardMaterial({ map: createEpoxyTex(), roughness: 0.55, metalness: 0.05 });

    const gratingMat = new THREE.MeshStandardMaterial({ map: createGratingTex(), roughness: 0.6, metalness: 0.35 });

    const lineYellowMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });

    const walkGreenMat = new THREE.MeshBasicMaterial({ color: 0x2f9e44, transparent: true, opacity: 0.88 });

    const lineWhiteMat = new THREE.MeshBasicMaterial({ color: 0xf1f5f9 });

    const hazardMat = new THREE.MeshBasicMaterial({ map: createHazardTex() });

    const fenceTex = createFenceTex();

    const fenceMat = new THREE.MeshBasicMaterial({ map: fenceTex, transparent: true, opacity: 0.55, side: THREE.DoubleSide });

    const machineBlueMat = new THREE.MeshStandardMaterial({ color: 0x2f6fd0, roughness: 0.35, metalness: 0.3 });

    const machineDoorMat = new THREE.MeshStandardMaterial({ color: 0x2456a8, roughness: 0.3, metalness: 0.35 });

    const windowGlowMat = new THREE.MeshBasicMaterial({ color: 0xbfe3ff });

    const silverMat = new THREE.MeshStandardMaterial({ color: 0xc0c8d0, roughness: 0.3, metalness: 0.75 });

    const darkSteelMat = new THREE.MeshStandardMaterial({ color: 0x2b3240, roughness: 0.5, metalness: 0.55 });

    const cabinetMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.4 });

    const screenMat = new THREE.MeshBasicMaterial({ color: 0x0f2233 });

    const rackBlueMat = new THREE.MeshStandardMaterial({ color: 0x1d4ed8, roughness: 0.45, metalness: 0.3 });

    const beamOrangeMat = new THREE.MeshStandardMaterial({ color: 0xf97316, roughness: 0.5, metalness: 0.2 });

    const goodsWhiteMat = new THREE.MeshStandardMaterial({ color: 0xeef2f6, roughness: 0.7 });

    const goodsBeigeMat = new THREE.MeshStandardMaterial({ color: 0xd6c79c, roughness: 0.75 });

    const goodsDarkMat = new THREE.MeshStandardMaterial({ color: 0x232830, roughness: 0.45, metalness: 0.25 });

    const glassMat = new THREE.MeshPhysicalMaterial({ color: 0xa5f3fc, transparent: true, opacity: 0.24, roughness: 0.08, metalness: 0.05, side: THREE.DoubleSide });

    const tileWhiteMat = new THREE.MeshStandardMaterial({ color: 0xe8ecef, roughness: 0.35 });

    const ledDiscMat = new THREE.MeshBasicMaterial({ color: 0xfff8e6 });

    const bollardMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.5 });

    const extingMat = new THREE.MeshStandardMaterial({ color: 0xdc2626, roughness: 0.4 });

    const hoodMat = new THREE.MeshStandardMaterial({ color: 0xd7dde3, roughness: 0.45, metalness: 0.5, side: THREE.DoubleSide });

    const flashGlowMat = new THREE.MeshBasicMaterial({ color: 0xffb35c });

    const skylightMat = new THREE.MeshBasicMaterial({ color: 0xeaf4ff });

    function createGabledRoof(width, length, roofHeight, mat = blueRoofMat) {

      const shape = new THREE.Shape();

      shape.moveTo(-width / 2, 0);

      shape.lineTo(0, roofHeight);

      shape.lineTo(width / 2, 0);

      shape.closePath();

      const geo = new THREE.ExtrudeGeometry(shape, { depth: length, bevelEnabled: false });

      const mesh = new THREE.Mesh(geo, mat);

      mesh.castShadow = true;

      mesh.receiveShadow = true;

      return mesh;

    }

    function createTreeMesh(scale = 1.0) {

      const t = new THREE.Group();

      const tr = new THREE.Mesh(new THREE.CylinderGeometry(0.18 * scale, 0.26 * scale, 1.3 * scale), trunkMat);

      tr.position.y = 0.65 * scale;

      const cr = new THREE.Mesh(new THREE.SphereGeometry(1.4 * scale, 9, 9), bushMat);

      cr.scale.y = 0.88;

      cr.position.y = 1.9 * scale;

      cr.castShadow = true;

      ];

      let html = `

        <path d="M ${cx - radius} ${cy} A ${radius} ${radius} 0 0 1 ${cx + radius} ${cy}"

              fill="rgba(8, 22, 48, 0.16)" stroke="rgba(255,255,255,0.45)" stroke-width="2" stroke-dasharray="6 4" />

        const x1 = cx - Math.cos(r) * (radius - 8);

        const y1 = cy - Math.sin(r) * (radius - 8);

        const x2 = cx - Math.cos(r) * radius;

          } else if (p < 0.80) {

            scene.background.setHex(0x1e293b);

            scene.fog.color.setHex(0x1e293b);

            updateHUD(2);

          } else {

            scene.background.setHex(0x091326);

            scene.fog.color.setHex(0x091326);

            updateHUD(3);

          }

        }

      }

    });

    tl.to(camLocal, {

      px: bay3LocalX, py: 4.0, pz: 16,

      lx: bay3LocalX, ly: 3.0, lz: -24,

      duration: 2.8,

      ease: 'power2.inOut'

    })

    .to(camLocal, {

      px: bay3LocalX - 0.6, py: 3.8, pz: -44,

      lx: bay3LocalX,       ly: 2.9, lz: -70,

      duration: 3.2,

      ease: 'none'

    })

    .to(camLocal, {

      px: bay3LocalX, py: 3.55, pz: -88,

      lx: bay3LocalX, ly: 2.8,  lz: -116,

      duration: 3.2,

      ease: 'none'

    })

    .to(camLocal, {

      px: bay3LocalX - 0.4, py: 3.4, pz: -140,

      lx: bay3LocalX,       ly: 2.7, lz: -178,

      duration: 3.0,

      ease: 'power1.out'

    });

    hudBtns.forEach((btn) => {

      btn.addEventListener('click', () => {

        const target = parseFloat(btn.getAttribute('data-target'));

        const maxScroll = document.body.scrollHeight - window.innerHeight;

        window.scrollTo({ top: target * maxScroll, behavior: 'smooth' });

      });

    });

    let mouseX = 0, mouseY = 0;

    window.addEventListener('mousemove', (e) => {

      mouseX = (e.clientX / window.innerWidth - 0.5) * 2;

      mouseY = (e.clientY / window.innerHeight - 0.5) * 2;

    });

    let lastT = performance.now();

    function animate() {

      requestAnimationFrame(animate);

      const nowT = performance.now();

      const dt = Math.min((nowT - lastT) / 1000, 0.05);

      lastT = nowT;

      interiorLight.position.z = camLocal.pz - 12;

      flowBumpers.forEach(b => {

        b.position.z -= dt * 1.7;

        if (b.position.z < -60) b.position.z = -9;

      });

      paintHooks.forEach(h => {

        h.position.z -= dt * 0.9;

        if (h.position.z < -105.5) h.position.z = -66.5;

      });

      const worldPos = fourHallsMasterGroup.localToWorld(

        new THREE.Vector3(camLocal.px, camLocal.py, camLocal.pz)

      );

      const worldLook = fourHallsMasterGroup.localToWorld(

        new THREE.Vector3(camLocal.lx + mouseX * 1.4, camLocal.ly - mouseY * 0.9, camLocal.lz)

      );

      camera.position.copy(worldPos);

      camera.lookAt(worldLook);

      renderer.render(scene, camera);

      renderProtractorSVG();

    }

    animate();

    window.addEventListener('resize', () => {

      camera.aspect = window.innerWidth / window.innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(window.innerWidth, window.innerHeight);

    });

    }

    // شروع صحنه پس از آماده شدن فونت فارسی (برای متن‌های کانواس)

    if (document.fonts && document.fonts.ready) {

      Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]).then(boot);

    } else {

      boot();

    }

  </script>
